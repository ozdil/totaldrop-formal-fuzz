# Hardened CI workflow for totaldrop-formal-fuzz: Linux x86-64 & ARM64
# workspace + fuzz harness verification, Tamarin Prover 1.12.0 + Maude 3.5.1
# symbolic proofs and mutation testing, REUSE 3.3, and secret scanning.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TAMARIN_VERSION: "1.12.0"
  TAMARIN_SHA256: 201be06f469e47cff554df6ca93db8366fc2c69d70c61fcbd1370a1074b469c6
  MAUDE_VERSION: "3.5.1"
  MAUDE_SHA256: 72ed1ca87e3b3d0dfc6ee1436baf154bf04c45ff97d521bec040c5e8dfc8f92c

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: -D warnings
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Format
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path fuzz/Cargo.toml --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        env:
          TOTALDROP_REQUIRE_IPV6: "1"
        run: cargo test --workspace --locked
      - name: Check fuzz harnesses
        run: cargo check --manifest-path fuzz/Cargo.toml --bins --locked

  models:
    name: Models
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        run: |
          set -eu
          list=$(cd formal && ls *.spthy | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "$list"

  formal:
    name: Tamarin (${{ matrix.model }})
    needs: models
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.models.outputs.list) }}
    env:
      FORMAL_MODELS: ${{ matrix.model }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Tamarin and Maude
        run: |
          set -eu
          dir="$RUNNER_TEMP/tamarin"
          mkdir -p "$dir"
          cd "$dir"
          curl --proto '=https' --tlsv1.2 -fsSL -o tamarin.tar.gz "https://github.com/tamarin-prover/tamarin-prover/releases/download/${TAMARIN_VERSION}/tamarin-prover-${TAMARIN_VERSION}-linux64-ubuntu.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o maude.zip "https://github.com/maude-lang/Maude/releases/download/Maude${MAUDE_VERSION}/Maude-${MAUDE_VERSION}-linux-x86_64.zip"
          printf '%s  tamarin.tar.gz\n%s  maude.zip\n' "$TAMARIN_SHA256" "$MAUDE_SHA256" | sha256sum -c -
          tar xzf tamarin.tar.gz
          unzip -q maude.zip
          chmod +x tamarin-prover maude
          echo "$dir" >> "$GITHUB_PATH"
          echo "MAUDE_LIB=$dir" >> "$GITHUB_ENV"
      - name: Versions
        run: tamarin-prover --version
      - name: Prove every lemma
        run: formal/check.sh
      - name: Every mutant shows its attack
        run: python3 formal/mutants.py

  reuse:
    name: Licenses (REUSE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Source files carry SPDX lines
        run: ./tools/check-spdx.sh
      - name: reuse lint
        run: >-
          docker run --rm --volume "$PWD:/data"
          fsfe/reuse:6.2.0@sha256:85462a75c0f8efda09ddd190b92816b70e7662577c8427429e11e1b9f25a992e
          lint

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Commits to scan
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          case $EVENT in
            pull_request) base=HEAD^1 ;;
            push) base=$BEFORE ;;
            merge_group) base=$MERGE_GROUP_BASE ;;
            *) base= ;;
          esac
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            range=$base..HEAD
          else
            base=HEAD range=HEAD
          fi
          echo "Scanning $range"
          { echo "BASE=$base"; echo "RANGE=$range"; } >>"$GITHUB_ENV"
      - name: No signing keys, key.properties or .gitleaksignore
        run: |
          found=$(
            { git ls-files -z
              git -c core.quotePath=false log --format= --name-only -z --no-renames --diff-filter=d "$RANGE"
            } | grep -ziE '(^|/)(key\.properties|\.gitleaksignore)$|\.(jks|keystore|p12|pfx|pepk)$' | tr '\0' '\n' | sort -u
          )
          if [ -n "$found" ]; then
            printf '%s\n' "$found"
            echo "::error::Signing keys, key.properties and .gitleaksignore must not be committed."
            exit 1
          fi
      - name: gitleaks
        if: ${{ !cancelled() && steps.range.outcome == 'success' }}
        run: |
          cfg=$RUNNER_TEMP/gitleaks
          mkdir -p "$cfg"
          if ! git show "$BASE:.gitleaks.toml" >"$cfg/gitleaks.toml" 2>/dev/null; then
            printf '[extend]\nuseDefault = true\n' >"$cfg/gitleaks.toml"
          fi
          docker run --rm --volume "$PWD/.git:/repo/.git:ro" --volume "$cfg:/cfg:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 \
            git --no-banner --redact --verbose --config /cfg/gitleaks.toml \
            --gitleaks-ignore-path /cfg --ignore-gitleaks-allow \
            --log-opts="--text $RANGE" /repo

  gate:
    name: CI
    if: always()
    needs: [test, models, formal, reuse, secrets]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null
